<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Receiver</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="d-flex flex-column flex-md-row align-items-md-end gap-3 mb-4">
        <div>
          <h1 class="mb-0">Log Receiver</h1>
          <small class="text-muted">View logs grouped by device MAC address</small>
        </div>
        <div class="ms-md-auto d-flex flex-wrap gap-2">
          <select id="macFilter" class="form-select">
            <option value="">All MAC Addresses</option>
          </select>
          <input
            id="searchInput"
            type="search"
            class="form-control"
            placeholder="Search logs"
          />
          <select id="sortSelect" class="form-select">
            <option value="created_at:desc">Newest first</option>
            <option value="created_at:asc">Oldest first</option>
            <option value="mac_address:asc">MAC (A-Z)</option>
            <option value="mac_address:desc">MAC (Z-A)</option>
            <option value="level:asc">Level (A-Z)</option>
            <option value="level:desc">Level (Z-A)</option>
          </select>
          <button id="refreshBtn" class="btn btn-primary">Refresh</button>
        </div>
      </div>

      <div class="table-responsive shadow-sm">
        <table class="table table-striped table-hover mb-0" id="logsTable">
          <thead class="table-dark">
            <tr></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="alert alert-info mt-3" role="alert">
        Use the API endpoint <code>POST /api/logs</code> with JSON payloads like
        <code>{"mac_address": "AA:BB:CC:DD:EE:FF", "message": "Started", "battery": 97}</code> to add entries.
        Any additional fields beyond the MAC address are stored and displayed automatically.
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
